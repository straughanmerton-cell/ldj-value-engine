name: ldj-value-engine

services:
  postgres:
    image: postgres:16-alpine
    container_name: ldj-value-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ldj
      POSTGRES_PASSWORD: ldj_dev_password
      POSTGRES_DB: ldj_dev
    ports:
      - "55433:5432"
    volumes:
      - ldj_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ldj -d ldj_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ldj_pg_data:
